name: Build Hyperion Client
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Gradle 9.5.1
        run: |
          curl -sSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-9.5.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          "$HOME/gradle-dist/gradle-9.5.1/bin/gradle" --version

      - name: Strip BOM from Java files
        run: |
          find src -type f -name '*.java' -exec env LC_ALL=C sed -i '1s/^\xEF\xBB\xBF//' {} +
          if find src -type f -name '*.java' -exec file {} + | grep -i 'with BOM'; then
            echo "::error::BOM still present"
            exit 1
          fi

      - name: Build
        run: "$HOME/gradle-dist/gradle-9.5.1/bin/gradle" build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Hyperion-JAR
          path: build/libs/*.jar
