plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}
version = '1.0.0'
group = 'com.hyperion'
repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}
dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.97.0+1.21.1"
    implementation 'io.github.spair:imgui-java-binding:1.86.5'
    implementation 'io.github.spair:imgui-java-lwjgl3:1.86.5'
    implementation 'org.openpnp:opencv:4.8.0-0'
    implementation 'com.google.code.gson:gson:2.10.1'
    include 'io.github.spair:imgui-java-binding:1.86.5'
    include 'io.github.spair:imgui-java-lwjgl3:1.86.5'
    include 'org.openpnp:opencv:4.8.0-0'
    include 'com.google.code.gson:gson:2.10.1'
}
loom { mixin { defaultRefmapName.set("hyperion-refmap.json") } }
processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
